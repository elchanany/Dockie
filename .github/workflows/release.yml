name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          TOOLS=$(ls -d "$ANDROID_HOME"/cmdline-tools/* | head -n 1)
          yes | "$TOOLS/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          DOCKIE_KEYSTORE_BASE64: ${{ secrets.DOCKIE_KEYSTORE_BASE64 }}
        run: |
          echo "$DOCKIE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dockie-release.keystore"
          echo "DOCKIE_KEYSTORE_PATH=$RUNNER_TEMP/dockie-release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          DOCKIE_KEYSTORE_PASSWORD: ${{ secrets.DOCKIE_KEYSTORE_PASSWORD }}
          DOCKIE_KEY_ALIAS: ${{ secrets.DOCKIE_KEY_ALIAS }}
          DOCKIE_KEY_PASSWORD: ${{ secrets.DOCKIE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify and stage Dockie.apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Built: $APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | head -n 5
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 3
          cp "$APK" Dockie.apk
          sha256sum Dockie.apk | tee Dockie.apk.sha256
          ls -la Dockie.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Dockie.apk
            Dockie.apk.sha256
          generate_release_notes: false
          body: |
            Dockie — stay awake while docked.

            Install Dockie.apk on your Android phone (allow "install unknown apps" once when prompted), grant the screen-timeout permission, and tap the big button. Put the phone on any wireless charger and the screen stays awake; take it off and your exact previous timeout is restored.
